<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法人税法 復習管理</title><style> *{box-sizing:border-box}body{font:17px system-ui;background:#f2f5f9;color:#17263c;max-width:900px;margin:auto;padding:24px}section,article{background:white;border-radius:16px;padding:20px;margin:14px 0}input,select,button{font:inherit;padding:12px;border:1px solid #ccd4df;border-radius:10px;margin:4px;max-width:100%}button{background:#174b80;color:white;border:0;cursor:pointer}button.secondary{background:#e8eef5;color:#174b80}small{color:#65758a}.late{color:#b42318}h1{font-size:28px}h3{margin:0 0 8px}#stats{font-size:20px;font-weight:bold} .actions{display:flex;flex-wrap:wrap} .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cell{background:#eef3f9;color:#17263c;min-height:76px;margin:0;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;border:2px solid transparent;font-size:15px}.cell.selected{border-color:#174b80;background:#dce9fa}.cell.today{font-weight:bold}.cell small{font-size:11px}.cell .late{color:#b42318}.nav{display:flex;align-items:center;justify-content:space-between}.weekday{text-align:center;font-size:13px;color:#65758a}.done{color:#18744b!important}@media(max-width:500px){body{padding:10px}section,article{padding:12px}.cell{min-height:65px;padding:3px;font-size:13px}.cell small{font-size:10px}} </style><h1>法人税法 復習管理</h1><section id="stats"></section><section><div class="nav"><button id="prev" class="secondary">‹</button><h3 id="month"></h3><button id="next" class="secondary">›</button></div><button id="today" class="secondary">今日へ</button><div id="calendar" class="calendar"></div><p><small>青枠：選択日　赤：未消化　緑：復習実績</small></p></section><section><h3>論点を登録</h3><form id="add"><select id="kind"><option>計算</option><option>理論</option></select><input id="topic" required placeholder="論点名"><input id="num" placeholder="問題番号・ページ"><label>初回復習日 <input type="date" id="start" required></label><button>登録</button></form></section><section><select id="filter"><option value="selected">選択日の予定・実績</option><option value="due">今日・期限超過</option><option value="all">すべて</option><option value="future">今後の予定</option></select><select id="category"><option>すべて</option><option>計算</option><option>理論</option></select></section><h3 id="listtitle"></h3><main id="list"></main><section><button id="backup">バックアップ保存</button><button class="secondary" id="restore">復元</button><input type="file" id="file" accept=".json" hidden><p><small>端末内保存。ブラウザのデータ削除に備えて定期的にバックアップしてください。</small></p><p id="warning" class="late"></p></section><script>
const $=id=>document.getElementById(id);let data=[];try{data=JSON.parse(localStorage.getItem('houjin-review-v1')||'[]')}catch(e){$('warning').textContent='保存データを読み込めませんでした。'}function day(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function after(n){let d=new Date();d.setDate(d.getDate()+n);return day(d)}function save(){try{localStorage.setItem('houjin-review-v1',JSON.stringify(data))}catch(e){$('warning').textContent='端末保存が利用できません。バックアップを保存してください。'}render()}function el(tag,text,parent,cls){let e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;parent.append(e);return e}function btn(parent,text,fn,cls){let b=el('button',text,parent,cls);b.onclick=fn;return b}function review(x,r){let intervals=[1,3,7,14,21,30,45,60,90];x.level=r===2?Math.min((x.level||0)+1,intervals.length):r===1?Math.min(x.level||0,2):0;let n=r===0?1:r===1?3:intervals[x.level-1];x.history.push({date:day(),rating:['苦手','曖昧','定着'][r],next:after(n)});x.due=after(n);save()}let selected=day(), month=new Date();month.setDate(1);$('start').value=selected;function calendar(){let root=$('calendar');root.replaceChildren();$('month').textContent=`${month.getFullYear()}年 ${month.getMonth()+1}月`;for(let w of ['日','月','火','水','木','金','土'])el('div',w,root,'weekday');for(let i=0;i<month.getDay();i++)el('div','',root);let count=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();for(let i=1;i<=count;i++){let d=day(new Date(month.getFullYear(),month.getMonth(),i));let b=btn(root,String(i),()=>{selected=d;$('start').value=d;$('filter').value='selected';render()},'cell'+(d===selected?' selected':'')+(d===day()?' today':''));let due=data.filter(x=>x.due===d), done=data.reduce((n,x)=>n+x.history.filter(h=>h.date===d).length,0);if(due.length)el('small',`予定 ${due.length}`,b,d<day()?'late':'');if(done)el('small',`済 ${done}`,b,'done')}}$('prev').onclick=()=>{month.setMonth(month.getMonth()-1);calendar()};$('next').onclick=()=>{month.setMonth(month.getMonth()+1);calendar()};$('today').onclick=()=>{selected=day();month=new Date();month.setDate(1);$('start').value=selected;$('filter').value='selected';render()};function render(){calendar();let now=day();$('listtitle').textContent=$('filter').value==='selected'?selected+' の復習':'復習一覧';$('stats').textContent=`今日・期限超過 ${data.filter(x=>x.due<=now).length}件　｜　登録 ${data.length}件　｜　累計復習 ${data.reduce((s,x)=>s+x.history.length,0)}回`;let root=$('list');root.replaceChildren();let rows=data.filter(x=>($('category').value==='すべて'||x.kind===$('category').value)&&($('filter').value==='all'||($('filter').value==='selected'?(x.due===selected||x.history.some(h=>h.date===selected)):($('filter').value==='due'?x.due<=now:x.due>now)))).sort((a,b)=>a.due.localeCompare(b.due));if(!rows.length)el('p','該当する論点はありません。',root);for(let x of rows){let a=el('article','',root);el('h3',x.topic,a);el('p',`${x.kind}　${x.num}　復習 ${x.history.length}回`,a);el('p',`次回：${x.due}${x.due<now?'（期限超過）':''}`,a,x.due<now?'late':'');let b=el('div','',a,'actions');if($('filter').value!=='selected'||x.due===selected)['苦手：翌日','曖昧：3日後','定着：間隔延長'].forEach((s,i)=>btn(b,s,()=>review(x,i)));let details=el('details','',a);el('summary','復習履歴・管理',details);for(let h of [...x.history].reverse())el('p',`${h.date}　${h.rating} → ${h.next}`,details);btn(details,'削除',()=>{if(confirm('この論点を削除しますか？')){data=data.filter(y=>y!==x);save()}},'secondary')}}$('add').onsubmit=e=>{e.preventDefault();data.push({kind:$('kind').value,topic:$('topic').value,num:$('num').value,due:$('start').value,level:0,history:[]});$('topic').value='';$('num').value='';save()};$('filter').onchange=$('category').onchange=render;$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='review-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let v=JSON.parse(await $('file').files[0].text());if(!Array.isArray(v)||!v.every(x=>x&&typeof x.topic==='string'&&typeof x.due==='string'&&Array.isArray(x.history)&&x.history.every(h=>h&&typeof h.date==='string')))throw Error();if(confirm('現在のデータをバックアップ内容で置き換えますか？')){data=v;save()}}catch(e){alert('バックアップ形式が正しくありません。')}$('file').value=''};render();</script></html>
